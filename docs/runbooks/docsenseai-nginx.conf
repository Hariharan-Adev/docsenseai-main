# Docsense AI Nginx site template for Ubuntu.
# Copy or merge this into /etc/nginx/sites-available/docsenseai on the server.
# If an existing server block for docsenseai.recezy.ai already exists, update that
# existing block instead of creating a duplicate server_name entry.

server {
    listen 80;
    server_name docsenseai.recezy.ai;

    root /var/www/docsenseai;
    index index.html;

    # Public /api/* calls are forwarded to FastAPI without the /api prefix.
    # Example: /api/projects -> http://127.0.0.1:8000/projects
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React router fallback for browser routes such as /projects.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# After editing the server config, IT should run:
# sudo nginx -t
# sudo systemctl reload nginx
#
# Verification:
# 1. http://127.0.0.1:8000/health works on the server.
# 2. https://docsenseai.recezy.ai/api/health works publicly.
# 3. Browser DevTools shows API calls as /api/auth/login and /api/projects.
